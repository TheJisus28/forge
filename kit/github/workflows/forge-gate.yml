# The two human gates of Forge are a pull request approval. When a
# maintainer approves, this records it in the spec so the file tells the
# truth without anybody having to remember a command.
name: forge gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write

jobs:
  gate:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/TheJisus28/forge@latest

      - name: Record the gate
        run: forge gate --by "${{ github.event.review.user.login }}" --base "origin/${{ github.event.pull_request.base.ref }}"

      - name: Commit the state change
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to record"
            exit 0
          fi
          git config user.name "forge"
          git config user.email "forge@users.noreply.github.com"
          git add .forge
          git commit -m "chore(forge): record approval by ${{ github.event.review.user.login }}"
          git push
