name: forge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/TheJisus28/forge@latest
      - run: forge validate

      # A broken main means somebody merged past the rules. Say it out loud.
      - name: Report a broken main branch
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Forge: main is inconsistent" \
            --body "\`forge validate\` failed on main after ${{ github.sha }}. Run it locally to see the findings."
